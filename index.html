<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FootwearHub - Login page for the FootwearHub online shoe store">
  <meta name="author" content="FootwearHub">
  <title>Login - FootwearHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-cover bg-center relative"
      style="background-image: url('images/background.jpg');">

  <div class="absolute inset-0 bg-black/50"></div>

  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">

    <div class="text-center mb-6">
      <img src="images/logo.png" alt="FootwearHub logo" class="h-20 w-20 mx-auto">
      <h1 class="text-3xl font-bold text-gray-800 mt-2">FootwearHub</h1>
      <p class="text-gray-500 text-sm mt-1">Step into your account</p>
    </div>

    <div id="errorBox" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-2 rounded mb-4 text-sm">
      Invalid username or password. Please try again.
    </div>

    <form id="loginForm" onsubmit="return doLogin(event)">

      <div class="mb-4">
        <label for="username" class="block text-gray-700 text-sm font-semibold mb-2">Username</label>
        <input type="text" id="username" name="username" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Enter your username">
      </div>

      <div class="mb-6">
        <label for="password" class="block text-gray-700 text-sm font-semibold mb-2">Password</label>
        <input type="password" id="password" name="password" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
               placeholder="Enter your password">
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        Login
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Don't have an account?
      <a href="register.html" class="text-blue-600 hover:underline font-semibold">Register here</a>
    </p>

  </div>

  <script src="js/auth.js"></script>
  <script>
    // Handles login form submit
    function doLogin(e) {
      e.preventDefault();
      var user = document.getElementById("username").value;
      var pass = document.getElementById("password").value;
      var ok = loginUser(user, pass);
      if (ok) {
        window.location.href = "dashboard.html";
      } else {
        // show error message
        document.getElementById("errorBox").classList.remove("hidden");
      }
      return false;
    }
  </script>

</body>
</html>
